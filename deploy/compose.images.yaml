# One backend service runs HTTP and image processing. Keep staging persistent.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.images
      target: app
    image: farm-images:local
    init: true
    restart: unless-stopped
    env_file: .env.images
    command: ["node", "--max-old-space-size=384", "dist/server.js"]
    ports: ["127.0.0.1:4000:4000"]
    volumes: ["image-staging:/var/lib/farm-images"]
    mem_limit: 2304m
    cpus: 2
    pids_limit: 128
    stop_grace_period: 45s
volumes:
  image-staging:
