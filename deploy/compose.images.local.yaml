name: farm-images-local
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.images
      target: app
    image: farm-backend-local
    init: true
    env_file: ../.env
    environment:
      NODE_ENV: development
      PORT: "4000"
      IMAGE_STAGING_DIR: /var/lib/farm-images
      SSIMULACRA2_BIN: /opt/libjxl/build/tools/ssimulacra2
      IMAGE_CONCURRENCY: "1"
    ports: ["127.0.0.1:4001:4000"]
    volumes: ["staging:/var/lib/farm-images"]
    mem_limit: 2304m
    cpus: 2
    pids_limit: 128
    stop_grace_period: 45s
volumes:
  staging:
