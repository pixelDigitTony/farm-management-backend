[package]
name = "farm-image-processor"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "MIT"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
libc = "0.2.177"

[build-dependencies]
cc = "1.2.43"
pkg-config = "0.3.32"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
